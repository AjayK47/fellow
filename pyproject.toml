[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docket"
version = "0.1.0"
description = "Graph-native organizational memory and context platform for enterprise agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "websockets>=15.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
documents = [
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=1.0.0",
  "Pillow>=10.0.0",
  "pymupdf>=1.24.0",
  "reportlab>=4.0.0",
]
browser = [
  "playwright>=1.50.0",
]

[project.scripts]
docket = "docket.main:main"
docket-gateway = "docket.main:main"
docket-seed = "docket.fixtures.seed:main"
docket-slack = "docket.slack_socket:main"
docket-worker = "docket.worker_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docket = ["builtin_skills/**/SKILL.md", "builtin_skills/**/resources/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
