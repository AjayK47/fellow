[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toda-ai"
version = "0.1.0"
description = "Self-hosted organizational coworker with permission-scoped memory and durable tasks"
readme = "README.md"
license = "MIT"
authors = [{name = "Ajay K"}]
keywords = ["ai-agent", "slack", "organizational-memory", "self-hosted", "coworker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "websockets>=15.0",
  "PyYAML>=6.0",
  "itsdangerous>=2.2.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=1.0.0",
  "Pillow>=10.0.0",
  "matplotlib>=3.9.0",
  "pymupdf>=1.24.0",
  "weasyprint>=62.0",
  "mcp>=2.0.0,<3.0.0",
  "sqlite-vec>=0.1.9",
  "filelock>=3.16.0",
  "opentelemetry-api>=1.44.0,<1.45.0",
  "opentelemetry-sdk>=1.44.0,<1.45.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<1.45.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66.0",
  "opentelemetry-instrumentation-httpx>=0.65b0,<0.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.12.0",
]
browser = [
  "playwright>=1.50.0",
]
local-embed = [
  "fastembed>=0.5.0",
]

[project.scripts]
toda = "toda.main:main"
toda-seed = "toda.fixtures.seed:main"
toda-eval = "evals.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toda = [
  "builtin_skills/**/SKILL.md",
  "builtin_skills/**/resources/**",
  "harness/prompting/templates/*.txt",
  "data/models_catalog.json",
  "data/models_catalog.provenance.json",
  "harness/infographic_runtime/*.mjs",
  "harness/infographic_runtime/package*.json",
  "static/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
