services:
  toda:
    build:
      context: .
    image: toda-ai:local
    restart: unless-stopped
    environment:
      # The only configuration Toda reads. Set server.host to 0.0.0.0 and
      # storage.data_dir to /var/lib/toda inside the file itself.
      TODA_CONFIG: /etc/toda/config.json
    ports:
      # Intentionally loopback-only. Put an authenticated TLS proxy in front
      # before changing this binding.
      - "127.0.0.1:8080:8080"
    volumes:
      - toda-data:/var/lib/toda
      - ./config.json:/etc/toda/config.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  toda-data:
